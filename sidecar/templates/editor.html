<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capsule editor | Gemini</title>
  <link rel="stylesheet" href="/static/editor.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="topbar-brand" href="/" aria-label="Back to capsule landing page">
        <span class="pixel-mark" aria-hidden="true"></span>
        <span>
          <span class="product-name">Cloud in a Bottle</span>
          <h1>Gemini capsule / editor</h1>
        </span>
      </a>
      <span class="title-rule" aria-hidden="true"></span>
      <span class="filename">
        <span>Current file</span>
        <strong id="current-file">(no file)</strong>
      </span>
      <a class="back-link" href="/">Landing &rarr;</a>
    </header>

    <aside class="sidebar">
      <div class="sidebar-heading">
        <span>// capsule files</span>
        <small>.gmi</small>
      </div>
      <div class="sidebar-actions">
        <button id="btn-new" type="button" class="new-file">New file</button>
        <button id="btn-delete" type="button" class="delete-file">Delete</button>
      </div>
      <nav id="file-list" aria-label="Capsule files"></nav>
    </aside>

    <section class="main">
      <div class="toolbar">
        <span class="hint"><span class="toolbar-label">// source mode</span><span class="hint-copy">Edit gemtext directly.</span> <a href="https://geminiprotocol.net/docs/gemtext-specification.gmi" target="_blank" rel="noopener">Gemtext reference</a></span>
        <span class="spacer"></span>
        <button id="btn-save" type="button" class="primary">Save</button>
        <span id="editor-status" class="editor-status" aria-live="polite">No file loaded</span>
      </div>
      <div class="editor-host-wrap">
        <label class="visually-hidden" for="editor-host">Gemtext source</label>
        <textarea id="editor-host"
                  spellcheck="true"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  wrap="soft"
                  placeholder="Pick a file from the sidebar or click 'New file' to start."></textarea>
      </div>
    </section>
  </div>

  <script type="module" src="/static/editor.js"></script>
</body>
</html>
